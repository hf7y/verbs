# build-verbs.yml -- the nightly verb build, assembled by GitHub Actions.
#
# INSTALL THIS AT: hf7y/verbs/.github/workflows/build-verbs.yml
# (see provision/verbs-meta/README.md for standing the repo up)
#
# Reads every hf7y repository carrying a `bashified` branch, applies the
# declaration rule (executable bin/<n> + man/<n>.1), and commits the union
# into THIS repository as one clone-able tree tagged build/<date>. A consumer
# then clones ONE repo instead of fetching from N and needing a credential for
# each -- Zach, on four hand-made deploy keys per account: "we can't do this
# for every install."
#
# TRAP: the logic is NOT in this file on purpose. It runs realisateur's
#   bin/cut-verb-build.sh. Retyping the declaration rule into YAML would be a
#   second source of truth for a question bin/lib/verb-set.sh already answers.
#
# TRAP: the refusals (BLIND, empty, an undeclared verb disappearance, a verb
#   declared by two projects) must run HERE, not on the consumer. On 2026-08-04 `cueille` was
#   declared by both bibliothecaire and quatre-vingt-douze, and mandark could
#   not see it because quatre-vingt-douze has no clone there -- install-verbs
#   reported "all 26 declared verbs present" and was structurally incapable of
#   noticing. A collision fails the build here, once, for everyone.
#
# TRAP: the disappearance check compares against the manifest.tsv in the checkout it
#   assembles into, NOT only $BUILD_ROOT/current -- which on a fresh runner
#   does not exist, making the check a no-op in the one place it would ever
#   run. Witness: "a shrinking build is refused with no local build root at
#   all" in bin/tests/cut-verb-build-test.sh.
#
name: build-verbs

on:
  schedule:
    # 01:30 UTC. Nightly, not on-merge: the build is the thing consumers
    # hold still against while agents merge, so it must NOT move every time
    # an agent pushes. That stability is the feature.
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      allow_half_declared:
        description: 'Cut despite half-declared names (executable with no man page), recording each in the manifest'
        type: boolean
        default: false
      dry_run:
        description: 'Derive and check the manifest only. Commits nothing, tags nothing.'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # Two builds committing to the same branch race and one silently loses.
  group: build-verbs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # THE DISPATCH DOOR IS GATED; THE CRON IS NOT (#601). Measured over 40 runs,
    # 27 builds came through workflow_dispatch, so the "hold still while agents
    # merge" stability declared above was not in force.
    # TRAP: an environment gates a JOB, so a bare name would also hold the
    #   SCHEDULED run for an approval nobody watches -- an outage of the thing
    #   this protects. An empty name applies no gate.
    environment: ${{ github.event_name == 'workflow_dispatch' && 'release' || '' }}
    steps:
      # The credential is asserted BEFORE anything else, because every
      # symptom of its absence is misleading. Without it the realisateur
      # checkout fails with a not-found (the repo is private, so "missing"
      # and "forbidden" look identical), and if that step were ever made
      #   [rest: vault:realisateur/guard-archaeology-20260817.md]
      - name: Assert the org credential exists
        env:
          TOKEN: ${{ secrets.VERBS_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN}" ]; then
            echo "::error::VERBS_READ_TOKEN is not set on this repository."
            echo "It must be a fine-grained PAT with READ on the org's repositories."
            echo "The default GITHUB_TOKEN is scoped to THIS repo alone: with it the"
            echo "derivation sees only the public projects and cuts a SHORT build that"
            echo "looks complete. Refusing to run rather than produce one."
            exit 1
          fi

      - name: Check out the meta-repo (this one)
        uses: actions/checkout@v4
        with:
          # Full history: the build tags live here and a shallow checkout
          # cannot push them.
          fetch-depth: 0

      - name: Check out realisateur for the build logic
        uses: actions/checkout@v4
        with:
          repository: hf7y/realisateur
          path: .realisateur
          token: ${{ secrets.VERBS_READ_TOKEN }}

      - name: Assemble the build
        env:
          # Needs read on every hf7y repo, including private ones. See the
          # assertion step above for why this is not GITHUB_TOKEN.
          GH_TOKEN: ${{ secrets.VERBS_READ_TOKEN }}
          # Inputs arrive as environment variables rather than being
          # interpolated into the script body. A `${{ }}` expansion inside
          # `run:` is textual substitution into shell source, and a workflow
          # that does it by habit is one input away from executing its own
          # input.
          ALLOW_HALF_DECLARED: ${{ inputs.allow_half_declared }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          # git needs the same credential the API call uses, because the
          # assemble step fetches each project's bashified sha over https.
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

          # RUN FROM OUTSIDE THE WORKSPACE. This is load-bearing and does not
          # look it.
          #
          # `actions/checkout` persists its credential as
          #   [rest: vault:realisateur/guard-archaeology-20260817.md]
          cd "$RUNNER_TEMP"
          args=(--owner hf7y)
          if [ "${DRY_RUN:-false}" = "true" ]; then
            # --dry-run refuses --assemble outright, so there is no path
            # from a dry run to a committed tree.
            args+=(--dry-run)
          else
            args+=(--assemble "$GITHUB_WORKSPACE")
          fi
          # The script has had --allow-half-declared since realisateur#145; the
          # workflow never wired it up, so the only escape from a
          # half-declaration was a hand run on somebody's laptop -- i.e. no
          # escape at all for the nightly, which is the one run that matters.
          # It is NOT silent: every half-declared name is printed and recorded
          # in the manifest, which is the whole difference between this and the
          # pre-#145 behaviour of discarding them without a word.
          if [ "${ALLOW_HALF_DECLARED:-false}" = "true" ]; then
            args+=(--allow-half-declared)
          fi
          bash "$GITHUB_WORKSPACE/.realisateur/bin/cut-verb-build.sh" "${args[@]}"

      # The publisher has to outlive the realisateur checkout, because it runs
      # `if: always()` -- including on the runs where the assemble itself
      # failed and there is nothing to drop from. Staged OUT of the workspace
      # so the next step can still delete .realisateur wholesale.
      - name: Stage the publisher outside the workspace
        if: always()
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/rbin/lib"
          cp .realisateur/bin/publish-release-verdict.sh "$RUNNER_TEMP/rbin/" 2>/dev/null || true
          cp .realisateur/bin/lib/cli-guard.sh "$RUNNER_TEMP/rbin/lib/" 2>/dev/null || true
          chmod +x "$RUNNER_TEMP/rbin/publish-release-verdict.sh" 2>/dev/null || true

      - name: Drop the build logic checkout
        # Unconditional: a failed assemble must not leave a checkout of
        # realisateur where a later `git add -A` could commit it into a
        # repository whose entire contract is "generated, do not hand-edit".
        if: always()
        run: rm -rf .realisateur

      - name: Commit and tag
        id: cut
        # THE GATE IS GONE (#598, #599, #600). It asked whether every
        # downstream project's default branch was green and refused the cut if
        # not -- and it errored or blocked 39% of nights, while grading only a
        # MINORITY of the manifest: three to ten verbs were UNGATED on every
        # cut, so GREEN never meant what it read as. It also gated on `main`
        # while the build ships from `bashified`, and the check that compared
        # those two was deleted before it. A sensor that reports clean over a
        # minority is the disease this estate keeps treating, so it was removed
        # rather than repaired.
        #
        # The verdict below is UNAFFECTED and is why removing it is safe: every
        # run still publishes what it did to one public URL, ausculte's
        # `propagation` probe still reads it, and a broken cut is still ERROR.
        # What is gone is the refusal, not the reporting.
        if: ${{ inputs.dry_run != true }}
        run: |
          set -euo pipefail
          git config user.name  'verb-build'
          git config user.email 'verb-build@users.noreply.github.com'

          # WHAT COUNTS AS A CHANGE -- and why this is not `git diff --quiet`.
          #
          # BUILD_ID is a fresh UTC timestamp every run, and the manifest
          # header carries that timestamp and the runner's hostname, so the
          #   [rest: vault:realisateur/guard-archaeology-20260817.md]
          manifest_payload() {  # <file-or-'-'> -> body rows + registry rows
            grep -v '^#' "$1" || true
            grep '^# registry' "$1" || true
          }
          if git cat-file -e HEAD:manifest.tsv 2>/dev/null; then
            git show HEAD:manifest.tsv > /tmp/prev-manifest
            manifest_payload /tmp/prev-manifest > /tmp/prev-body
          else
            : > /tmp/prev-body
          fi
          manifest_payload manifest.tsv > /tmp/new-body

          git add -A
          payload_changed=0
          cmp -s /tmp/prev-body /tmp/new-body || payload_changed=1
          while read -r f; do
            case "$f" in
              ''|BUILD_ID|manifest.tsv) ;;
              *) payload_changed=1 ;;
            esac
          done < <(git diff --cached --name-only)

          if [ "$payload_changed" -eq 0 ]; then
            echo "No project moved since the last build: same shas, same tree."
            echo "Not cutting a new tag -- the current build IS today's build."
            git reset --hard HEAD
            echo "cut=NO_CHANGE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CUT_INTERVAL_DAYS="${CUT_INTERVAL_DAYS:-30}"  # #602: cut monthly, assemble stays nightly; matches PUBLISH_CUT_INTERVAL_D (#603)
          last_tag="$(git tag -l 'build/*' | sort | tail -1)"
          if [ -z "$last_tag" ]; then
            interval_elapsed=1
            interval_note="no previous build tag"
          else
            last_ts="$(git log -1 --format=%ct "$last_tag")"
            now_ts="$(date -u +%s)"
            age_days=$(( (now_ts - last_ts) / 86400 ))
            if [ "$age_days" -ge "$CUT_INTERVAL_DAYS" ]; then
              interval_elapsed=1
            else
              interval_elapsed=0
            fi
            interval_note="last cut ${age_days}d ago, interval is ${CUT_INTERVAL_DAYS}d"
          fi

          if [ "$interval_elapsed" -eq 0 ]; then
            echo "Project(s) moved, but the cut interval has not elapsed ($interval_note)."
            echo "Not cutting yet -- the accumulated changes ship in the next cut."
            git reset --hard HEAD
            echo "cut=NO_CHANGE" >> "$GITHUB_OUTPUT"
            echo "cut_reason=payload changed, waiting on the cut interval ($interval_note)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          build_id="$(cat BUILD_ID)"
          n="$(grep -cv '^#' manifest.tsv)"
          git commit -m "verb build ${build_id}: ${n} verb(s)"
          # The tag is the thing consumers pin to. Immutable by
          # convention: a build that can be re-pointed is not a build.
          git tag "build/${build_id}"
          git push origin HEAD --tags
          echo "cut=CUT" >> "$GITHUB_OUTPUT"
          echo "build_id=${build_id}" >> "$GITHUB_OUTPUT"
          echo "verbs=${n}" >> "$GITHUB_OUTPUT"

      # ======================================================================
      # THE VERDICT. Published EVERY run, to ONE public URL, whatever happened.
      # ======================================================================
      # This step is the whole inversion, and `if: always()` is the load-bearing
      #   [rest: vault:realisateur/guard-archaeology-20260817.md]
      - name: Publish the verdict
        if: always()
        env:
          STATUS_PAGE_TOKEN: ${{ secrets.STATUS_PAGE_TOKEN }}
          CUT_STATE:    ${{ steps.cut.outputs.cut }}
          CUT_BUILD:    ${{ steps.cut.outputs.build_id }}
          CUT_VERBS:    ${{ steps.cut.outputs.verbs }}
          CUT_REASON:   ${{ steps.cut.outputs.cut_reason }}
          DRY_RUN:      ${{ inputs.dry_run }}
        run: |
          set -uo pipefail
          # A dry run is not a verdict about the channel: it produces no
          # artifact by construction, so publishing one would put a
          # NO_CHANGE-shaped row in the history for a night the nightly job
          # may not even have run.
          if [ "${DRY_RUN:-false}" = "true" ]; then
            echo "dry run: no verdict published, deliberately."; exit 0
          fi
          if [ ! -x "$RUNNER_TEMP/rbin/publish-release-verdict.sh" ]; then
            echo "::error::the publisher could not be staged -- NO verdict was published."
            echo "Consumers will see the emitter go silent, which is the correct"
            echo "reading: this run could not say what it did."
            exit 1
          fi

          # Decide the verdict from what the run actually did. With the gate
          # gone there is no BLOCKED case left: nothing refuses a cut, so an
          # absent build is either NO_CHANGE or a broken run, and saying which
          # is this step's whole job.
          if [ "${CUT_STATE:-}" = CUT ]; then
            decision=CUT
            reason="${CUT_VERBS:-?} verb(s) cut"
          elif [ "${CUT_STATE:-}" = NO_CHANGE ]; then
            decision=NO_CHANGE
            reason="${CUT_REASON:-no project moved -- today's build is still current}"
          else
            decision=ERROR
            reason="the cut step produced no result; see run ${GITHUB_RUN_ID}"
          fi

          echo "verdict: $decision -- $reason"
          prc=0
          "$RUNNER_TEMP/rbin/publish-release-verdict.sh" --apply \
            --decision "$decision" --reason "$reason" \
            --main-sha "${GITHUB_SHA:0:7}" --ci-run "${GITHUB_RUN_ID}" \
            --build-id "${CUT_BUILD:--}" || prc=$?
          [ "$prc" -eq 0 ] && exit 0

          # ==================================================================
          # THE FALLBACK, and why the publisher's rc is captured at all.
          # ==================================================================
          # 2026-08-07, the first real gated cut. `--build-id "${CUT_BUILD:--}"`
          #   [rest: vault:realisateur/guard-archaeology-20260817.md]
          echo "::warning::the full publish invocation failed (rc=$prc). Retrying with a minimal argv."
          frc=0
          "$RUNNER_TEMP/rbin/publish-release-verdict.sh" --apply \
            --decision "$decision" \
            --reason "$reason (published by the minimal fallback: the full invocation exited $prc)" \
            || frc=$?
          if [ "$frc" -eq 0 ]; then
            echo "::error::the verdict published only via the MINIMAL FALLBACK (full invocation rc=$prc)."
            echo "The channel is intact but the publish step is broken -- fix it before the fallback is"
            echo "load-bearing. The run is failed on purpose so this is not discovered by archaeology."
            exit 1
          fi
          echo "::error::NO VERDICT WAS PUBLISHED. Full invocation rc=$prc, minimal fallback rc=$frc."
          echo "The release channel is KNOWINGLY SILENT for this run. https://hf7y.com/verbs/status.json is"
          echo "serving a verdict from a previous night; it is NOT a statement about this one, and it"
          echo "will grade BAD on every consumer once it passes its published valid_until."
          exit 1

          exit 1
