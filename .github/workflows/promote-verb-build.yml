# promote-verb-build.yml -- approve one cut build. INSTALL AT
# hf7y/verbs/.github/workflows/promote-verb-build.yml
# A CUT IS NOT A RELEASE. build-verbs.yml's cron is ungated and used to reach
# every host anyway. `approved/<id>` is the only tag a host adopts, only this
# reviewer-gated job writes it, and nothing is built here.
name: promote-verb-build

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Build id to approve, e.g. 2026-09-01T030800Z. Empty = the newest cut.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Approve one build, and refuse anything that is not one
        env:
          BUILD_ID: ${{ inputs.build_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          git fetch -q --tags origin
          id="$BUILD_ID"
          if [ -z "$id" ]; then
            id="$(git tag --list 'build/*' --sort=-refname | head -1)"; id="${id#build/}"
          fi
          [ -n "$id" ] || { echo "::error::no build/* tag exists"; exit 1; }
          if ! git rev-parse -q --verify "refs/tags/build/$id" >/dev/null; then
            echo "::error::no such build: $id"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/approved/$id" >/dev/null; then
            echo "already approved: $id"; exit 0
          fi
          # API, NOT `git push`: GITHUB_TOKEN cannot push a ref whose commit
          # carries .github/workflows/, and every build commit here does.
          sha="$(git rev-parse "refs/tags/build/$id^{commit}")"
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
                 -f ref="refs/tags/approved/$id" -f sha="$sha" >/dev/null \
            || { echo "::error::could not create refs/tags/approved/$id"; exit 1; }
          echo "approved $id" >> "$GITHUB_STEP_SUMMARY"
