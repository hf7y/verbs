# realisateur -- owns the toolchain every other self-dev account consumes.
# Its queue is hf7y/realisateur; it drains that queue (#111, 2026-08-11), and
# does NOT scaffold new projects -- that was the job before it had a worker.

PROJECT="realisateur"
PROJECT_KEY="realisateur"

PROJECT_REPO_PATH="$HOME/Documents/Projects/realisateur"

REPO_URL="https://github.com/hf7y/realisateur.git"
REPO_SUBDIR="."
ANSWER_CHANNEL="issues"

# --- which account and host own this job -----------------------------------
# CRON_HOST is load-bearing: sync-crontab.sh checks it FIRST and `continue`s;
# without it every sync from another host errors. Host first, account second.
CRON_HOST="monkey"
CRON_ACCOUNT="realisateur"

# --- TIER 1, bug sweeper: DISABLED, no live web tracker ---------------------
SWEEP_JOB_NAME=""

# --- TIER 2, overnight batch: paced participant (schedule/_paced.conf) ------
BATCH_JOB_NAME="realisateur-nightly-batch"
BATCH_PROMPT="You are realisateur. You own the toolchain every other self-dev
account consumes, and your queue is hf7y/realisateur.

1. Work the issue queue:
     gh issue list --repo hf7y/realisateur --state open

   No starting issue is named here on purpose: a literal issue number goes
   stale the day it closes and keeps being dispatched anyway.

2. TRIAGE IS NOT FIFO. Before picking, read the open titles and ask of each:
   does its premise still hold? An issue whose premise expired should be
   CLOSED, saying which decision or commit expired it. Closing three dead
   issues beats half-building a fourth.

3. CLOSE WHAT YOU RESOLVE. Zach, standing instruction: agents should close
   issues that are clearly resolved, not leave them to Zach -- he will not,
   and they will clutter. Close with a comment naming what landed and where.

4. YOUR BLAST RADIUS IS THE WHOLE ESTATE, and this is the one way your queue
   differs from every other account's. Twelve accounts run tools this repo
   ships. A bad merge here does not break realisateur, it breaks all of them
   at once, and the account that could repair it is downstream of the same
   build. Two things hold that line and neither is optional: main requires
   green checks with enforce_admins ON since 2026-08-11, and the verb build
   verifies every verb a manifest promises before switching, discarding a
   partial build rather than serving it. Do not weaken either. If a change
   would, that is a DECISION line for a human, not a merge."
# 120 -> 240, 2026-08-16. Over 33 runs in scheduler-runs/realisateur.jsonl, 7
# hit the ceiling and EVERY one that had committed left the work UNPUSHED --
# 11 commits, no consumer. REVERT if "max turns" stops appearing in the log.
BATCH_MAX_TURNS="240"
USES_STANDING_RULES=1


# --- TIER 3, SHOTGUN: one agent that is N (hf7y/scheduler#586) --------------
# NOT a cron participant: `dose realisateur --shotgun`, fired by hand when the
# usage window has slack going to waste. Six subagents in ONE `claude -p` cost
# ~390 MB against ~1680 MB for six processes (#586), and run inside one lock
# hold. `Agent` in ALLOWED_TOOLS is the whole mechanism; the witness asserts it.
SHOTGUN_JOB_NAME="realisateur-shotgun"
SHOTGUN_ALLOWED_TOOLS="Bash,Read,Write,Edit,Glob,Grep,Agent"
# 240, as BATCH -- but turns are PER-AGENT (an Agent call costs the parent one),
# so the ceiling that truncated 7 of 33 runs below does not bind here.
SHOTGUN_MAX_TURNS="240"
SHOTGUN_USES_STANDING_RULES=1
SHOTGUN_PROMPT="You are realisateur, and this run is a SHOTGUN: work your queue
with N=6 subagents at once, each on a disjoint shard.

@@FRAGMENT:gen2@@

@@FRAGMENT:shotgun@@

Your blast radius is the whole estate, and six agents do not change what holds
that line: main requires green checks with enforce_admins ON, and the verb
build verifies every verb a manifest promises before switching. Do not weaken
either. A change that would is a DECISION line for a human, not a merge.

Six shallow PRs that pass CI are a worse outcome than two real ones. Depth per
shard, not PR count."
