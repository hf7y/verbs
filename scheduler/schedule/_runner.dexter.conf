# Paced-runner tick meta -- HOST-SCOPED to `dexter`.
#
# Overrides schedule/_runner.conf PER FIELD. Shared file is sourced first, then
# this one, so anything not set here keeps the shared value (RUNNER_JOB,
# RUNNER_CMD). State only what differs -- a field restated here is a second
# copy that will drift.
#
# WHY THIS FILE EXISTS (2026-07-29, THE PLAY run 3):
# The rotation has been per-host since 2026-07-24 (schedule/_paced.dexter.conf)
# but the TICK that drives it was read from one shared file. So
# `sync-crontab.sh --apply` on dexter would have installed mandark's cadence:
#
#   */5 PACED_MAX_PER_TICK=16 USAGE_CEILING=0.99
#
# against the */30 PACED_MAX_PER_TICK=1 dexter had been running deliberately --
# a 6x rate increase on the host that shares ONE account budget with mandark.
# That gap is why dexter's crontab was hand-written on 2026-07-24 and why its
# own header called host-scoping "an open item". The generator could not say
# what this host needed, so a human bypassed the generator, and then nothing
# regenerated a crontab here for five days.
#
# THE VALUES BELOW ARE NOT NEW POLICY. They are what dexter's hand-written
# crontab actually ran, transcribed from the backup taken before run 3 emptied
# it, so this file makes the generator able to reproduce the status quo rather
# than quietly changing it:
#   realisateur/archive/crontab-backups/dexter-crontab-2026-07-29T1425.bak
#     */30 * * * * PACED_MAX_PER_TICK=1 /home/zach/.local/bin/usage-paced-runner.sh
#
# WHY */30 AND MAX_PER_TICK=1 RATHER THAN MANDARK'S */5 AND 16 -- the reason is
# the shared budget, not caution about dexter: both hosts draw on one weekly
# quota, and dexter's gate reads that same quota. A fast tick with a high
# per-tick cap here does not add throughput, it just lets one host win the race
# for a budget the other is also spending. Raising these is a real decision
# about how the quota is SPLIT, not a knob to tune for speed.
# RUNNER_CRON RETIRED 2026-08-22 (hf7y/scheduler#81): dexter's tick rate is
# now per-project in schedule/ROSTER, applied by `dose <project> --apply`,
# not a host override here. The */30 history above still explains why this
# host ran slower than mandark's */5 before the switch.

# USAGE_CEILING deliberately NOT set here. It belongs in
# schedule/_usage.dexter.conf, which bin/usage-gate.sh reads directly and picks
# up on the next tick with no --apply. Setting it here would bake it onto a
# generated crontab line, where it would silently outrank the conf a human just
# edited -- schedule/_runner.conf's own header states this trap in full.
RUNNER_ENV="PACED_MAX_PER_TICK=1"
