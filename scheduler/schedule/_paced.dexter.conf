# Participants for usage-paced-runner.sh -- HOST-SCOPED to `dexter`.
#
# Same format as schedule/_paced.conf (name|enabled|command). See that
# file's header for field semantics.
#
# WHY THIS FILE EXISTS (2026-07-24, dexter bring-up): dexter and mandark are
# two INDEPENDENT schedulers sharing one git-tracked repo, so each host may
# own its own rotation file:
#
#   schedule/_paced.<short-hostname>.conf   picked up automatically by that host
#   schedule/_paced.conf                    used by any host without its own file
#
# dexter writes ONLY this file; mandark writes ONLY _paced.conf -- different
# paths, so the two hosts cannot produce conflicting edits to the same lines.
# List registered hosts with: ls schedule/_paced.*.conf
#
# HOST POLICY (2026-07-28, Zach-directed): dexter is the default execution
# host; a project stays on mandark only for a stated reason.
#
# `scheduler` is deliberately NOT here: two hosts independently committing to
# one scheduler git history is the divergence hazard THE PLAY resolved by
# making dexter the sole writer of scheduler's own history (2026-07-29).
#
# crt and wtul were both pinned here 2026-07-24/25, credential-gapped, then
# unregistered entirely on 2026-08-01 (parked in realisateur/WAITING-ROOM.md
# pending the ecosystem redesign). Full per-project credential sagas are in
# git history (`git log -p -- schedule/_paced.dexter.conf`), not repeated
# here -- neither row exists any more.
