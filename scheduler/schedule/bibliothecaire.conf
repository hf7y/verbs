# bibliothecaire -- the library: shelve, catalogue, retrieve, and now triage.
#
# REGISTERED 2026-08-02 to record a CLASSIFICATION, not to arm dispatch.
#
# Why this file exists at all. In this ecosystem the registry means "utility"
# (`realisateur/.scheduler/FOCUS.md`, W1). A verb is a utility's finished form;
# a product's finished form is an event outside the computer
# (`realisateur/WAITING-ROOM.md:10-18`). `bashify emit` and `bashify coin`
# already refuse a project with no conf here -- but only at MINT time, and
# never again, which is how `abletim` and `wtul` kept verbs after being
# deregistered. bibliothecaire declares 7 verbs and had no conf, so it read as
# a product carrying a verb surface. Zach classified it a utility on
# 2026-08-02; this file is that decision, mechanized.
#
# ---------------------------------------------------------------------------
# ARMED: YES, TIER 2 ONLY (2026-08-31, `dose bibliothecaire --arm`, #427).
# ---------------------------------------------------------------------------
# TIER 1 is blank, nothing armed. TIER 2 is SET and ARMED: ROSTER's `state`
# column for bibliothecaire reads `live`, and _paced.monkey.conf carries an
# enabled=1 row for it. This file's presence does not itself arm a project;
# liveness is ROSTER's `state` column, read by usage-paced-runner.sh at
# dispatch (WITNESS: tests/paced-roster-authority-witness.sh).
#
# ---------------------------------------------------------------------------
# THE OPEN ITEM, recorded here because it is the reason this is not simple
# ---------------------------------------------------------------------------
# bibliothecaire's `main` still carries a live, hardware-bound PRODUCT: a
# physical scanner writing to an SMB share, three systemd timers firing on
# schedule (intake every 15 min, OCR hourly, health daily), with OCR ceilings
# tuned to this machine's RAM after a real OOM kill. By the classifier's own
# words that is "an event outside the computer".
#
# The decision (Zach, 2026-08-02) is that the SCANNER is the product and should
# be parted off into its own repo, leaving bibliothecaire a core utility that
# is stable and non-agent. That extraction is DEFERRED, not done. Until it
# happens this conf describes a repo that is a utility by intent and a product
# by content, and that gap is the thing to close -- not to forget.

PROJECT="bibliothecaire"
PROJECT_KEY="bibliothecaire"
# --- which account and host own this job's STATE ----------------------------
# CRON_ACCOUNT is what `scheduler`'s state_account()/state_home()/state_run()
# read to answer "whose ~/.local/share holds this job's run log" -- unset, the
# glance reads $HOME instead and reports a live job as idle/dead-man expired
# (hf7y/scheduler#33).
#
# CRON_HOST is load-bearing, not decorative: sync-crontab.sh checks it FIRST
# and `continue`s cleanly, because bibliothecaire is a real account only on
# monkey -- without it, syncing from mandark errors instead of skipping.
# Host first, account second, in that order.
CRON_HOST="monkey"
CRON_ACCOUNT="bibliothecaire"


PROJECT_REPO_PATH="$HOME/Documents/Projects/bibliothecaire"

REPO_URL="https://github.com/hf7y/bibliothecaire.git"
REPO_SUBDIR="."

# ===========================================================================
# TIER 1 -- bug sweeper: BLANK. No live web tracker, and nothing is armed.
# ===========================================================================
SWEEP_JOB_NAME=""

# ===========================================================================
# TIER 2 -- overnight batch: SET and ARMED (2026-08-31, #427). See the ARMED
# block above for what makes that so.
# ===========================================================================
# --- bibliothecaire as a RESEARCH SERVICE (2026-08-04, Zach-directed) --------
#
# "right now I just want a service that another project can call on to dispatch
# for research. for example generate donna haraway corpus. or write essay on
# these 5 texts."
#
# THE INTERFACE IS A GITHUB ISSUE labelled `request` on hf7y/bibliothecaire.
# That is the whole calling convention: no new transport, no daemon, no queue
# file with its own locking -- and it works from every host and every account
# that has `gh`, including ones that cannot reach this filesystem at all.
#
# A mail bus was the other candidate and is deliberately NOT built. The office
# has a working one (office-smtpd on nomac) and it is the right answer for a
# trust boundary between agents. This is not that: caller and callee are the
# same person's projects, the channel already exists, and Zach already reads
# it. Adding a transport nobody needed is Law 3's exhibit.
#
# WHAT MOVES AND WHAT DOES NOT. bibliothecaire's INTAKE half is hardware-bound
# -- physical scanner on mandark's LAN, SMB share served by mandark's smbd, OCR
# ceilings tuned to 7GiB after a real OOM. It stays. This job is the LIBRARIAN
# half: lookup, corpus assembly, citation checking, prose. It needs a network
# and an agent and nothing physical, which is why it is the half that can move.
BATCH_JOB_NAME="bibliothecaire-research"
ANSWER_CHANNEL="issues"

# The three labels ARE the state machine, and they live on the issue rather
# than in a file so a caller can see progress without access to this host:
#   request      filed, not yet picked up
#   in-progress  claimed by a run, so a second run does not duplicate it
#   delivered    result posted; durable output consigned
# Two-tier selector: prefer eligible `request`-labelled issues; fall back to
# oldest open issue not in-progress and not deferred -- a `request`-only
# selector can match 0 issues while real work sits unreachable under other
# labels, and an armed account with nothing to pick up reads as idle either
# way. `gh issue list` has no `--exclude-labels`; the fallback below uses
# `--search` instead, verified against `hf7y/bibliothecaire` directly since no
# test in this repo runs the commands a BATCH_PROMPT contains.
BATCH_PROMPT="You are bibliothecaire, the librarian. Work the research request queue.

1. List open requests, prioritizing the \`request\` queue:
     gh issue list --repo hf7y/bibliothecaire --label request --state open
   If no eligible (open, not in-progress) requests exist, list open issues instead:
     gh issue list --repo hf7y/bibliothecaire --state open --search '-label:in-progress -label:deferred'

2. Take the OLDEST from whichever list applies, and CLAIM it
   before doing any work:
     gh issue edit <n> --repo hf7y/bibliothecaire --add-label in-progress
   Work ONE request per run. A half-finished second one is worse than a queue
   that moves slowly.

3. Do the research. The tools are installed and they are the point:
     cueille author|title|doi|item   where a work is readable without payment
     fonde corpus                    does the citation actually check out
     fonde consign <path>            deposit prose into the vault as linked data
     range, glane, accroche          the shelved corpus and the p92 harvest
   cueille has a FETCH BUDGET and reports it. Respect it -- refusing to spend
   more is a correct outcome, not a failure.

4. Deliver. Post the result as a comment on the issue. If it is prose worth
   keeping, consign it to the vault and cite the vault path in the comment: a
   comment is a message, the vault is the record. Then:
     gh issue edit <n> --repo hf7y/bibliothecaire --add-label delivered
     gh issue close <n> --repo hf7y/bibliothecaire

5. HONESTY RULES, which matter more here than throughput.
   - If a source cannot be reached, say so on the issue. 'I could not look' is
     never 'there is nothing there'. cueille already reports negative results
     and asks that they be recorded; do that.
   - Never invent a citation, a page number or a quotation. An unverifiable
     claim is worse than an absent one -- fonde exists precisely to refuse
     material whose citation does not check out.
   - If the request is ambiguous, ask ON THE ISSUE and leave it open rather
     than guessing. The human reads it there.

6. Before stopping, record a verdict so the scheduler can tell a finished run
   from a truncated one:
     \$HOME/Documents/Projects/scheduler/bin/verdict.sh set bibliothecaire <VERDICT> \"<one line>\"

   CONTINUE   there is ACTIONABLE work left -- an open request you could pick
              up on the next run without anyone else doing anything first.
   DONE       nothing actionable right now. THIS INCLUDES a queue whose only
              open requests are BLOCKED WAITING ON A HUMAN. You asked; the
              answer arrives when it arrives. Recording CONTINUE there gets
              you re-dispatched every tick to re-read an issue that has not
              changed, which spends real quota to learn nothing.
   IMPOSSIBLE a real dead end, not merely out of turns.

If the queue is empty: do nothing, say so, record DONE."

# WHY THE VERDICT WORDING IS THIS PEDANTIC. "Queue not empty" and "there is
# work I can do" are different facts, and only the second should re-arm
# dispatch: a request open but blocked on a human reply is not actionable, and
# recording CONTINUE for it re-dispatches the agent every tick to re-read an
# issue nobody has touched. A blocked request is un-parked by the human's
# reply, not by another run.

# 40 (the engine default) is fine for a code-sweep but truncated the first
# research runs mid-source-check with no verdict written. A single request
# here spends turns on cueille/fonde probes per source. Matches ecosim's own
# BATCH_MAX_TURNS=120 rather than inventing a second number.
BATCH_MAX_TURNS="120"

# Opt-in to the shared schedule/_standing-rules.md block, prepended to
# BATCH_PROMPT at dispatch by bin/scheduler-run -- see that script's comment
# for why this is a file now rather than prose retyped into three confs.
# Project-level; set BATCH_USES_STANDING_RULES / SWEEP_USES_STANDING_RULES
# instead to scope it to one tier.
USES_STANDING_RULES=1

