# apms -- the weekly class loop for APMS 2173 (Canvas, ledger, session form).
#
# REGISTERED 2026-08-25, Zach-directed: "yes stand up but ensure it has a no
# publish to canvas guard."
#
# THE GUARD IS THE LINE BELOW, and it is the precondition of this file
# existing at all. bin/scheduler-run sources this conf (line 44), so the export
# reaches the dispatched claude process and everything it spawns. apms's
# canvas.py refuses every non-GET when it is set -- a named Refused at the one
# socket all four of its other guards already live at, not a convention.
#
# Do not "clean up" this export. Without it an unattended run can rewrite a
# live discussion topic in a real course; apms's own NeverDelete guard means a
# wrong write can only be followed up, never withdrawn, and it reaches five
# students. hf7y/apms-2173#23 is the guard it switches on.
export APMS_READ_ONLY=1

PROJECT="apms"
PROJECT_KEY="apms"
CRON_HOST="monkey"
CRON_ACCOUNT="apms"
PROJECT_REPO_PATH="$HOME/Documents/Projects/apms"
REPO_URL="https://github.com/hf7y/apms-2173.git"
REPO_SUBDIR="."
SWEEP_JOB_NAME=""
BATCH_JOB_NAME="apms-nightly-batch"
BATCH_PROMPT="@@FRAGMENT:run-procedure@@

YOU MAY NOT PUBLISH TO CANVAS. APMS_READ_ONLY=1 is exported into this run and
canvas.py refuses every non-GET while it is set. That is deliberate, it is
Zach's instruction, and it is not an obstacle to work around: do not unset it,
do not edit the guard out, and do not write a script that bypasses canvas.py.
Reads work fine. If an issue genuinely cannot be finished without a live
write, say so and record DONE -- publishing is a button Zach clicks.

Before stopping, record a verdict so the scheduler can tell a finished run
from a truncated one:
  \$HOME/Documents/Projects/scheduler/bin/verdict.sh set apms <VERDICT> \"<one line why>\"

@@FRAGMENT:verdict-semantics@@
"
BATCH_MAX_TURNS="120"
USES_STANDING_RULES=1
