# Paced-runner tick meta -- HOST-SCOPED to `monkey`.
#
# Overrides schedule/_runner.conf PER FIELD; the shared file is sourced first.
# State ONLY what differs -- a field restated here is a second copy that will
# drift.
#
# RUNNER_CRON RETIRED 2026-08-22 (hf7y/scheduler#81): this host's tick rate is
# per-project in schedule/ROSTER now, applied by `dose <project> --apply`, so
# a host override of the cadence cannot live here. The 2026-08-04 raise/revert
# of that field, and why it was reverted ~9h later, are in this file's own
# history: git log -p -- schedule/_runner.monkey.conf
#
# ONE THING FROM THAT ARGUMENT IS STILL TRUE OF THIS HOST, so it stays:
#
# THE CRON RATE WAS NEVER THE THING PROTECTING THE QUOTA. bin/usage-gate.sh
# is: it probes Anthropic's account-wide rate-limit headers and HOLDs above
# the ceiling or the even-burn line, on every tick, whatever the cron says.
# The rate only decides how often we ASK; the gate decides how often the
# answer is yes.
#
# DO NOT RESTATE THE GATE'S KNOBS HERE. schedule/_usage.conf is the one place
# USAGE_CEILING and USAGE_RUSH_BEFORE_RESET_MIN are set; this file's copy read
# 0.99/10080 against the real 0.90/720 for 24 days, and the "~1% headroom, rush
# always on" finding that rested on it went with it (hf7y/scheduler#375).
RUNNER_ENV="PACED_MAX_PER_TICK=1"
