# wtul -- REGISTERED 2026-08-14, Zach-directed ("register wtul in scheduler so
# its repo clones"). ARMED 2026-08-14 (see the BATCH_* block below): a paced
# row exists in schedule/_paced.monkey.conf and schedule/ROSTER lists
# wtul@monkey as live at 20m. This paragraph used to say "not armed" -- that
# went stale the moment the row below landed and nobody updated it (#317).
#
# WHAT THIS FILE IS ACTUALLY FOR, in the order the need appeared. The account
# wtul@monkey was stood up the same day with realisateur's
# bin/setup-selfdev-project.sh, and its own repo did NOT land. land-selfdev.sh
# derives the clone list from schedule/<p>.conf's REPO_URL -- "every other repo
# is DERIVED, not typed", because a typed list is a second source that drifts
# from the registry. With no wtul.conf, wtul was not a registered project, so
# the account landed the default SELFDEV_PROJECTS set (senechal ecosim) and
# never cloned hf7y/wtul. This file is what makes that clone happen.
#
# WHY THE BATCH FIELDS ARE EMPTY AND MUST STAY THAT WAY UNTIL A PACED ROW
# EXISTS. sync-crontab.sh enables the batch tier unless BATCH_JOB_NAME,
# BATCH_SCRIPT and BATCH_CRON are ALL empty (bin/sync-crontab.sh:678). With any
# one of them set and no paced row to suppress it, the project gets a FIXED
# nightly cron line. On 2026-08-05 that is exactly what happened: five projects
# were written with BATCH_JOB_NAME + BATCH_CRON="auto" and five nightly lines
# were installed in chezz's crontab for projects with no clone and no brief.
# See schedule/crt.conf, which records that incident where it can be acted on.
#
# PROBED 2026-08-14 rather than assumed:
#   * hf7y/wtul -- PUBLIC, default branch `main`, last pushed 2026-08-14.
#   * ONLY branch is `main`. No `bashified` branch, so wtul declares NO VERB;
#     install-verbs.sh's "registered" column will show it with none.
#   * carries .scheduler/FOCUS.md and .scheduler/QUESTIONS.md already, so the
#     brief an armed run would read is present and in the WRITABLE location --
#     not under .claude/, which an unattended run cannot write (harness
#     sensitive-file gate).
#   * unix account wtul exists on monkey (uid band 3000-3099), release
#     bootstrap and selfdev-release-tick cron installed, App token minting
#     verified live. It is landed and not armed.
#   * a real pytest suite: 540 passed / 33 skipped / 1 failed on monkey once
#     python3-pytest, python3-mutagen, python3-pil, python3-qrcode and
#     cd-discid were installed host-wide. The one failure is a genuine logic
#     bug filed as hf7y/wtul#36, not an environment gap.
#
# BEFORE ARMING (done later that same day, 2026-08-14), three things that
# were NOT true yet at probe time:
#   1. No paced row. Add one in schedule/_paced.monkey.conf in the SAME commit
#      that sets any BATCH_* field, or you re-create the 2026-08-05 bug above.
#   2. Arming spends a shared weekly quota. That is a judgment, and every guard
#      in this ecosystem stops one step short of it.

PROJECT="wtul"
PROJECT_KEY="wtul"
# Self-dev lives on monkey (realisateur/MONKEY.md). CRON_HOST keeps mandark
# from emitting these lines; CRON_ACCOUNT is STATE ownership (scheduler#33 --
# four monkey jobs read 7-12d idle while running daily because no conf set it).
CRON_HOST="monkey"
CRON_ACCOUNT="wtul"
PROJECT_REPO_PATH="$HOME/Documents/Projects/wtul"
REPO_URL="https://github.com/hf7y/wtul.git"
REPO_SUBDIR="."
SWEEP_JOB_NAME=""
# ARMED 2026-08-14, Zach-directed in session ("arm it"). The paced row in
# schedule/_paced.monkey.conf landed in the SAME commit as these fields --
# setting these without the paced row is the 2026-08-05 bug the header describes.
BATCH_JOB_NAME="wtul-nightly-batch"
BATCH_PROMPT="/wtul-batch
FIRST, work the issue queue -- it is the queue Zach actually files into, and
it is not visible from .scheduler/FOCUS.md:
  gh issue list --repo hf7y/wtul --state open
Pick ONE issue you can finish tonight, finish it, and close it in the same
run with a comment saying what landed and where. Triage is not FIFO: an
issue whose premise has expired should be closed with the reason, and that
is real work. If nothing in the queue is actionable, say so plainly and
record DONE -- an honest empty run beats an invented one.

TESTING: this repo has a real pytest suite -- 635 passed / 8 skipped /
0 failed on monkey as of 2026-08-26. Run \`pytest -q\` from the repo root
before you claim anything works.

DO NOT run install.sh. It installs udev rules, systemd units and
/usr/local/bin scripts for a physical CD drive this VM does not have."
BATCH_MAX_TURNS="120"
USES_STANDING_RULES=1
