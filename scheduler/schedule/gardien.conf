# gardien -- rsync+hardlink nightly backup of mandark/dexter onto a local
# RAID array, scaffolded by realisateur from a dropped inbox note.
# Registered 2026-07-22.
#
# Follows the crt/realisateur/groc-mangr/vim-arcade precedent: git repo
# pushed to a LOCAL bare remote (no credentials/network needed), generic
# bin/scheduler-run entrypoint, joins the usage-paced governor as a Tier 2
# participant (see schedule/_paced.conf) instead of a fixed cron time.
#
# Scope is unattended-safe because hf7y/gardien's own CLAUDE.md insists all
# real rsync logic stay exercised against temp directories -- never a real
# RAID mount or host. It lives in the repo the run checks out, so the run
# reads it nightly without this conf restating it.

PROJECT="gardien"
PROJECT_KEY="gardien"

CRON_HOST="monkey"
CRON_ACCOUNT="gardien"
# hf7y/scheduler#328/#33. CRON_ACCOUNT also flips the workspace in
# lib/sweep-loop-common.sh, so the pin holds that unwitnessed flip.
SELFDEV_IN_ACCOUNT=0

PROJECT_REPO_PATH="$HOME/Documents/Projects/gardien"

REPO_URL="https://github.com/hf7y/gardien.git"
REPO_SUBDIR="."

# ===========================================================================
# TIER 1 -- bug sweeper: DISABLED. gardien has no live web tracker.
# ===========================================================================
SWEEP_JOB_NAME=""

# ===========================================================================
# TIER 2 -- overnight batch: paced participant (see schedule/_paced.conf).
# ===========================================================================
BATCH_JOB_NAME="gardien-nightly-batch"

# PILOT for hf7y/realisateur#744: this was BATCH_PROMPT="/nightly-batch",
# loading one of NINE hand-rewritten copies of one procedure. That procedure
# is now schedule/_run-procedure.md, spliced in by bin/scheduler-run. No
# project-specific prose remains: gh resolves the repo from the clone's own
# remote, and gardien's values live in its CLAUDE.md (above). The empty
# remainder is the result, not a gap. Markers expand AFTER this file is
# sourced, so a $VAR inside a fragment reaches the agent literally.
BATCH_PROMPT="@@FRAGMENT:run-procedure@@"
BATCH_MAX_TURNS="120"


# 2026-08-17: these rules were written for every dispatched account, and four
# projects were not reading them. hf7y/realisateur#127.
USES_STANDING_RULES=1
