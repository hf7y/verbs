# Pacing knobs for bin/tempo.sh -- the thermostat's SETPOINT.
#
# Read directly by the script (parsed, not sourced -- scalar knobs only, no
# shell logic), so a change here is picked up on the next tick: no --apply, no
# crontab edit, nothing to redeploy. Same contract as schedule/_usage.conf,
# and deliberately the same file shape so there is one convention to learn.
#
# Precedence, per FIELD:
#   1. explicit env            TEMPO_BASE_MIN=60 bin/tempo.sh realisateur
#                              (how you test a value without committing it)
#   2. _tempo.<host>.conf      per-host override, e.g. _tempo.monkey.conf
#   3. this file               the shared base
#   4. the script's built-in defaults, documented below and left commented out
#                              on purpose: the script stays the single
#                              definition of each default.
#
# Verify what took effect: the verdict line reports the resolved numbers and
# where the two load-bearing ones came from, e.g.
#   verdict=RUN project=realisateur ... want_min=34 knobs=base:_tempo.conf,pivot:default
#
# WHAT THIS IS AND WHAT usage-gate.sh IS. This decides PACE per project; the
# gate decides whether the QUOTA is at risk, account-wide. Both must say yes.
# Setting a fast tempo cannot overspend, because the gate is downstream of it
# and unchanged; setting a slow one cannot save a blown quota either.

# --- the setpoint ----------------------------------------------------------
# want_min = clamp( BASE_MIN * PIVOT / max(1, actionable), MIN_MIN, MAX_MIN )
#
# where actionable = open issues minus those carrying a blocked label. Read
# bin/tempo.sh's header before changing any of these -- the arithmetic and the
# reason there is no second penalty term are stated there, not here, so there
# is one place to correct if it turns out to be wrong.

# Interval, in minutes, for a project holding exactly PIVOT actionable issues.
# Default: 120 -- the pre-thermostat rate, so switching tempo on moved nobody.
#TEMPO_BASE_MIN=120
# SET 2026-08-27, Zach-directed ("I 4xed my usage so I can get everyone going"):
# that 4x, at the setpoint. The gate is downstream, so this cannot overspend.
TEMPO_BASE_MIN=30

# The backlog that maps to BASE_MIN. Default: 12 -- the fleet's median open
# count measured 2026-08-16 across the ten live roster rows (6 6 7 10 11 12 15
# 25 26 63 open; 5 6 6 8 10 11 15 24 26 42 actionable).
#TEMPO_PIVOT_ISSUES=12

# Clamps. Neither an empty tracker nor a flooded one may produce an absurd
# pace. Defaults: 20 and 1440 -- so the fastest any project can be paced is
# every 20 minutes and the slowest is once a day, and a project whose whole
# tracker is human-gated still gets one look per day rather than going dark.
#TEMPO_MIN_MIN=20
#TEMPO_MAX_MIN=1440

# --- the sensor ------------------------------------------------------------
# Labels that mean "an agent cannot finish this; a human must". Subtracted
# from the open count before the division -- that subtraction IS #147's
# inversion, and a project whose tracker is entirely these lands at MAX_MIN.
# Default: needs-human -- ONE label, and it is DERIVED, not typed: it means
# line 1 of the body declares `DECISION:`. `etiquette` is the grammar and the
# reconciler (hf7y/realisateur), and nothing else may be added here without
# answering "does this label mean a HUMAN is in the way".
#
# NARROWED 2026-08-18 from `needs-human,deferred,blocked,question`, on Zach's
# call, because the other three do not mean that and were braking agent work:
#   * `deferred` is written by `defere`, which parks work FOR AN AGENT. All 3
#     of hf7y/verbs' open issues carried it ("copy the yml", "gate the cut on
#     CI green") and paced that repo at MAX_MIN -- once a day -- so the label
#     was throttling the very work it described.
#   * `question` was in use as a TOPIC label: chezz #6 "Difficulty theory",
#     #5 "Earcons + vibration", #4 "Roguelike respawn loop".
# Nothing slowed down; five projects sped up. Measured effect on want_min:
# verbs 1440->480, bibliothecaire 206->144, chezz 120->72, ecosim 206->160,
# nine-speakers 240->206, scheduler 90->80. realisateur and dcp-gate-site are
# unchanged -- they are the two repos that already carried `needs-human`.
#TEMPO_BLOCKED_LABELS=needs-human

# How long a tracker reading may be reused before it is re-fetched, minutes.
# 0 disables the cache and fetches every tick. Default: 30 -- backlogs move in
# hours, and at a fine ask-rate most ticks are holds; a hold must not buy a
# network round-trip, the same rule that puts the DONE cooldown ahead of the
# live quota probe in usage-paced-runner.sh.
#TEMPO_CACHE_MIN=30

# --- the off switch --------------------------------------------------------
# 0 makes every answer RUN and says so on the verdict line, so a disabled
# thermostat is visible in the log rather than indistinguishable from one that
# happens to be agreeing. There is exactly one of these: usage-paced-runner.sh
# deliberately carries no second bypass, because a knob on the crontab line
# that outranks the file someone just edited is hf7y/scheduler#119.
#TEMPO_ENABLED=1
