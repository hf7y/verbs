# inv-redirects -- vaporwave self-dev (realisateur#695). Host notes: _paced.vaporwave.conf.
# WHAT IT IS: one kilobyte of hardcoded short links. An empty queue here is the expected steady state.
PROJECT="inv-redirects"
PROJECT_KEY="inv-redirects"
CRON_HOST="vaporwave"
CRON_ACCOUNT="inv-redirects"
PROJECT_REPO_PATH="$HOME/Documents/Projects/inv-redirects"
REPO_URL="https://github.com/hf7y/inv-redirects.git"
REPO_SUBDIR="."
ANSWER_CHANNEL="issues"
SWEEP_JOB_NAME=""
BATCH_JOB_NAME="inv-redirects-nightly-batch"
BATCH_PROMPT="@@FRAGMENT:run-procedure@@
Your queue is hf7y/inv-redirects's open issues, and it IS the scope.
DO NOT invent a purpose for this project. Nobody has written one down, and
guessing produces work no one asked for; hf7y/scheduler#535 records that
deciding what this project is for is Zach's, filed as issues on this repo.
Work ONE issue, close it, open a PR against main.
If the queue is genuinely empty, record DONE and stop. That is the expected
outcome here, not a failure to find something."
BATCH_MAX_TURNS="120"
USES_STANDING_RULES=1
