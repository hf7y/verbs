# vim-arcade -- platformer-style vim-motion teaching game, scaffolded by
# realisateur from a dropped inbox note. Registered 2026-07-20.
#
# Follows the crt/realisateur/groc-mangr precedent: git repo pushed to a
# LOCAL bare remote (no credentials/network needed), generic
# bin/scheduler-run entrypoint, joins the usage-paced governor as a Tier 2
# participant (see schedule/_paced.conf) instead of a fixed cron time.
#
# Scope is unattended-safe because .claude/commands/nightly-batch.md only
# builds against FOCUS.md's stated priorities (new vim-motion levels/
# mechanics, all unit-tested and curses-free) -- the one genuinely open
# design fork (tmux interactions) is explicitly flagged as a
# QUESTIONS.md-worthy proposal rather than something to guess deep on.
#
# ANSWER_CHANNEL="issues" (2026-08-04, vim-arcade@monkey self-dev
# arming): joins the chezz/ecosim/bibliothecaire GitHub-issues channel
# instead of the file-based `.claude/QUESTIONS.md` convention -- same
# mechanism, not a new one (`bin/scheduler`'s `answer_channel`/`cmd_ask`/
# `cmd_questions_issues`). vim-arcade's own account on monkey has a
# read-write deploy key for hf7y/vim-arcade (realisateur/MONKEY.md 8.3),
# so `gh` calls against its own repo need no separate credential.
# `question`/`answered` labels are created on first use via
# `ensure_gh_labels` -- no manual step. See `.claude/commands/
# nightly-batch.md`, updated alongside this to read/write issues instead
# of the file.
ANSWER_CHANNEL="issues"

PROJECT="vim-arcade"
PROJECT_KEY="vim-arcade"
# --- which account and host own this job's STATE (2026-08-05) ---------------
# CRON_ACCOUNT is what `scheduler`'s state_account()/state_home()/state_run()
# read to answer "whose ~/.local/share holds this job's run log". Until today
# NO conf in this repo set it, so state_account() always returned empty,
# state_home() always fell back to $HOME, and the whole per-account
# abstraction -- including its BLIND state -- had never once been exercised.
# That is why the glance reported these four as 7-12d idle and dead-man
# expired while they ran daily on monkey (hf7y/scheduler#33).
#
# CRON_HOST is set ALONGSIDE it, and is load-bearing rather than decorative.
# sync-crontab.sh checks CRON_HOST FIRST and `continue`s cleanly; without it,
# the next guard would fire `ERROR: CRON_ACCOUNT=vim-arcade is not a user on mandark
# -- skipping this conf` on every sync from mandark, because vim-arcade is a real
# account only on monkey. Host first, account second, in that order.
#
# DO NOT DROP CRON_ACCOUNT TO SILENCE A DOUBLE-DISPATCH ERROR (hf7y/scheduler#40,
# resolved 2026-08-11). #40 reported that setting CRON_ACCOUNT here while
# vim-arcade is ALSO an enabled row in schedule/_paced.monkey.conf made every
# sync-crontab.sh on every uid-3000 account print
#   ERROR [vim-arcade]: ... -- that is double dispatch. Park it there
#   (enabled 0) or drop CRON_ACCOUNT, and re-run.
# and left the tier out of the crontab. Both remedies that error text suggested
# are wrong, and the error itself is gone: 3029e02 (PR #47, 2026-08-05) retired
# it, because its premise was false. Rotation membership is EXACTLY what
# suppresses this project's fixed Tier 2 line, so there is no second dispatch
# path to collide with -- the guard duplicated the mechanism standing behind it.
# It is now a `note` that does not skip the conf.
#
# CRON_ACCOUNT + an enabled paced row is the CORRECT configuration on monkey,
# not a contradiction. Deleting it would re-break #33 exactly: state_account()
# would return empty, state_home() would fall back to the READING account's
# $HOME, and `scheduler status vim-arcade` from any other account would answer
# from /home/<reader>/.local/share/vim-arcade-nightly-batch -- a path that does
# not exist -- reporting a nightly job as idle and dead-man expired instead of
# saying BLIND. Dispatch would not change at all; only the sensor would lie.
# Witnessed by tests/sync-crontab-paced-witness.sh case 7 ("no ERROR raised for
# a paced participant that also owns its own state").
CRON_HOST="monkey"
CRON_ACCOUNT="vim-arcade"


PROJECT_REPO_PATH="$HOME/Documents/Projects/vim-arcade"

REPO_URL="https://github.com/hf7y/vim-arcade.git"
REPO_SUBDIR="."

# ===========================================================================
# TIER 1 -- bug sweeper: DISABLED. vim-arcade has no live web tracker.
# ===========================================================================
SWEEP_JOB_NAME=""

# ===========================================================================
# TIER 2 -- overnight batch: paced participant (see schedule/_paced.conf).
# ===========================================================================
BATCH_JOB_NAME="vim-arcade-nightly-batch"
BATCH_PROMPT="You are vim-arcade. Your role in the backlog-as-sensor build is

DISPLAYING THE NUMBERS TO ZACH (Zach's mapping, 2026-08-06: bibliothecaire
files, ecosim monitors, scheduler runs the mechanism, vim-arcade displays).

1. Work the issue queue:
     gh issue list --repo hf7y/vim-arcade --state open

   No starting issue is named here on purpose: a literal issue number goes
   stale the day it closes and keeps being dispatched anyway. Choose with rule
   2 below.

   What the display is FOR, as a standing statement rather than a ticket:
   open-issue count per project, its FIRST DERIVATIVE (rising or falling
   matters more than the absolute number), and issue age. That display is what
   closes the loop for the whole build -- a number nobody sees cannot pace
   anything. The form is your call.

@@FRAGMENT:triage-rules@@

   When you display a number, say what it does NOT cover. The scheduler's
   dispatch counts read as authoritative while being crontab-only, and that
   blind spot hid a 10x over-dispatch for a full day.

6. Before stopping, record a verdict so the scheduler can tell a finished run
   from a truncated one:
     \$HOME/Documents/Projects/scheduler/bin/verdict.sh set vim-arcade <VERDICT> \"<one line why>\"

@@FRAGMENT:verdict-semantics@@
"
BATCH_MAX_TURNS="120"

# TEST_CMD (2026-07-25, autonomy-merge gate): existing pytest suite under
# tests/.


# Opt-in to the shared schedule/_standing-rules.md block, prepended to
# BATCH_PROMPT at dispatch by bin/scheduler-run -- see that script's comment
# for why this is a file now rather than prose retyped into three confs.
# Project-level; set BATCH_USES_STANDING_RULES / SWEEP_USES_STANDING_RULES
# instead to scope it to one tier.
USES_STANDING_RULES=1
