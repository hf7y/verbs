# TRAP 1 -- PARK, NEVER DELETE. Verified 2026-08-06, see witness below.
#
# Fixed-cron suppression keys on rotation MEMBERSHIP, not on the enabled flag
# (lib/paced-conf.sh, paced_membership_set; bin/sync-crontab.sh's is_paced,
# gated by PACED_SUPPRESS_BATCH=1 in schedule/_runner.conf). Deleting a row
# therefore ARMS an auto-staggered fixed nightly BATCH cron line for that
# project on the next `sync-crontab.sh --apply`. Commenting a row out has the
# same effect -- paced_membership_set skips `#`-prefixed names on purpose.
#
# WITNESS: tests/sync-crontab-paced-witness.sh, case "membership decides
# suppression, across every host's rotation".
#
# THE ONE SAFE WAY TO DELETE A ROW: delete schedule/<name>.conf in the SAME
# change. sync-crontab.sh's project glob reads schedule/*.conf, so with no conf
# there is no entry left to re-arm. That is how the 2026-08-01 unregistration
# of twelve rows was done safely. Preview with `./bin/sync-crontab.sh` and
# confirm no new `:BATCH` line before applying.
#
# TRAP 2 -- MEMBERSHIP IS A UNION across schedule/_paced.conf AND every
# schedule/_paced.<host>.conf (paced_membership_set, lib/paced-conf.sh:118).
# "Does the paced system own this project?" is an ecosystem-wide question and
# reads ecosystem-wide; "does it dispatch HERE, right now?" is host-local and
# reads resolve_paced_conf. Answering the first per-host arms a fixed line on
# every host that does not list the project -- that bug was live on 2026-07-29
# and is why the union exists. The union is also the monotonically safe
# direction: it can only ever suppress a line, never arm one.
