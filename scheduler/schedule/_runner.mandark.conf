# Paced-runner tick meta -- HOST-SCOPED to `mandark`. INERT.
#
# It used to opt mandark out of the runner tick by blanking RUNNER_CRON.
# RUNNER_CRON was retired 2026-08-22 (hf7y/scheduler#81) and no file in
# schedule/ sets it, so bin/sync-crontab.sh:224 can never arm RUNNER_OPTOUT
# and this file overrides nothing. Kept because tests/runner-conf-host-
# witness.sh case 6 sources it by name to prove the runner and sweep tiers
# are separately attributable.
#
# TO PUT MANDARK BACK ON THE TICK: give a project a schedule/ROSTER row
# naming mandark as its account, then `dose <project> --apply` as that
# account. Nothing here.
#
# The retirement itself (2026-08-03, Zach: "delete it via dog fooding if
# possible") and why an empty rotation still cost a quota probe every tick
# are in this file's own history: git log -p -- schedule/_runner.mandark.conf
